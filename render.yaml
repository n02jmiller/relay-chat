services:
  - type: web
    name: relay-chat
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: relay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: RELAY_TOKEN_SECRET
        generateValue: true
      - key: RELAY_DATA_FILE
        value: /var/data/data.json
